name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend · mvn test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar tests (JUnit + Mockito)
        run: ./mvnw -B test

      - name: Publicar resultados de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Compilar (tsc + vite)
        run: npm run build

  docker-smoke:
    name: Docker · build + smoke test end-to-end
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Construir imágenes
        run: docker compose build

      - name: Levantar el stack
        run: docker compose up -d

      - name: Esperar a que el backend esté healthy
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend listo"
              exit 0
            fi
            sleep 5
          done
          echo "El backend no respondió a tiempo"
          docker compose logs backend
          exit 1

      - name: Smoke test de la API y del frontend
        run: |
          set -euo pipefail
          EMAIL="ci-$GITHUB_RUN_ID@taskflow.dev"

          echo "→ Registro"
          REGISTER=$(curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"CI Bot\",\"email\":\"$EMAIL\",\"password\":\"secret123\"}")
          TOKEN=$(echo "$REGISTER" | jq -r .token)
          test -n "$TOKEN" && test "$TOKEN" != "null"

          echo "→ Login"
          curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"secret123\"}" | jq -e '.token != null'

          echo "→ Crear tarea"
          TASK_ID=$(curl -fsS -X POST http://localhost:8080/api/tasks \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"title":"Tarea de CI","priority":"HIGH"}' | jq -r .id)

          echo "→ Listar tareas"
          curl -fsS http://localhost:8080/api/tasks -H "Authorization: Bearer $TOKEN" \
            | jq -e --argjson id "$TASK_ID" 'any(.[]; .id == $id)'

          echo "→ Completar tarea"
          curl -fsS -X PATCH "http://localhost:8080/api/tasks/$TASK_ID/toggle" \
            -H "Authorization: Bearer $TOKEN" | jq -e '.status == "DONE"'

          echo "→ Aislamiento entre usuarios (401 sin token)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/tasks)" = "401"

          echo "→ Frontend servido por Nginx"
          curl -fsS http://localhost:3000/ | grep -qi '<title>TaskFlow'

          echo "→ Nginx proxy /api hacia el backend"
          curl -fsS http://localhost:3000/api/tasks -H "Authorization: Bearer $TOKEN" \
            | jq -e 'length >= 1'

          echo "Smoke test OK ✅"

      - name: Logs en caso de fallo
        if: failure()
        run: docker compose logs --no-color

      - name: Apagar el stack
        if: always()
        run: docker compose down -v
